<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#146b60">
  <title>報修登記｜讓問題有著落</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script defer src="./config.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="site-header"><a class="brand" href="./index.html"><span class="brand-mark" aria-hidden="true">修</span>報修登記</a><span class="header-note">問題留下，進度看得見</span></header>
  <main>
    <section class="intro"><p class="eyebrow">REPAIR DESK</p><h1>讓每個問題，<br>都有著落。</h1><p>設備故障、網路異常或環境問題，<br class="mobile-break">在這裡留下紀錄。</p></section>
    <section class="panel" aria-labelledby="form-heading">
      <div class="section-heading"><div><p class="eyebrow">01 / NEW REQUEST</p><h2 id="form-heading">新增報修</h2></div><span class="muted">照片網址選填，其餘必填</span></div>
      <p class="privacy-note">清單會公開顯示填寫內容，請勿填入電話、密碼或其他敏感資訊。</p>
      <form id="repair-form">
        <fieldset id="form-fields">
          <div class="form-grid">
            <label>報修人<input name="reporter_name" autocomplete="name" required maxlength="100" placeholder="請輸入稱呼"></label>
            <label>地點或部門<input name="location" required maxlength="200" placeholder="例如：示範部門 A 區"></label>
            <label>類別<select name="category" required><option value="" disabled selected>請選擇類別</option><option>設備</option><option>網路</option><option>環境</option><option>其他</option></select></label>
            <label>緊急程度<select name="urgency" required><option>低</option><option selected>中</option><option>高</option></select></label>
            <label>負責人<input name="assignee" required maxlength="100" placeholder="請輸入負責人的稱呼"></label>
            <label>照片網址（選填）<input name="photo_url" type="url" inputmode="url" maxlength="2048" placeholder="https://example.com/photo.jpg"><span class="field-help">只接受 HTTP／HTTPS 網址，不會自動載入照片。</span></label>
            <label class="full-width">問題說明<textarea name="description" required maxlength="5000" rows="5" placeholder="請描述發生的問題與目前狀況"></textarea><span class="field-help">最多 5,000 字元，請勿提供敏感資訊。</span></label>
          </div>
          <div class="form-footer"><span class="muted">送出後會以「待處理」登記</span><button id="submit-button" type="submit">送出報修 <span aria-hidden="true">↗</span></button></div>
        </fieldset>
      </form>
      <p id="form-message" class="message" role="status" aria-live="polite" aria-atomic="true"></p>
    </section>
    <section class="requests-section" aria-labelledby="list-heading">
      <div class="section-heading"><div><p class="eyebrow">02 / RECENT REQUESTS</p><h2 id="list-heading">最近報修 <span class="count" id="request-count">—</span></h2></div><button type="button" class="secondary" id="refresh-button">重新整理</button></div>
      <p class="muted">顯示最近 20 筆，依登記時間由新到舊排列。</p>
      <p id="list-message" class="message" role="status" aria-live="polite" aria-atomic="true"></p>
      <div id="request-list" class="request-list" aria-busy="false"></div>
    </section>
  </main>
  <footer>報修登記 · 一筆紀錄，一步改善</footer>
</body>
</html>
